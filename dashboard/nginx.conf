map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 512;

    # Cache wallpapers & vendor JS/CSS for fast repeat loads
    location /wallpapers/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location /assets/ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /favicon.ico {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files /favicon.ico =404;
    }

    location = /favicon.svg {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files /favicon.svg =404;
    }

    location = /favicon.png {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files /favicon.png =404;
    }

    # Authenticated OS Shell, Real-Time AI Stream, Browser WebSocket Stream & REST API Proxy
    location /api/ {
        proxy_pass http://hub-backend:8000/api/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Public Lock Screen only (never cache index.html)
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        try_files $uri $uri/ /index.html;
    }
}
