# =============================================================================
# Node Production Release — Modular App & LMS Registry
# Fresh installations start empty (`apps: []`). Install apps in 1 click from
# the built-in App Library or add custom URLs via WebOS Monitors / AI Chat.
# =============================================================================

global:
  poll_interval_seconds: 30
  heartbeat_every_cycles: 10
  warm_reload_minutes: 45
  navigation_timeout_ms: 45000
apps: []
