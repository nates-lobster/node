name: tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # matches backend/Dockerfile
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r backend/requirements.txt pytest pytest-timeout
      - name: Syntax-check the dashboard JS
        run: node --check backend/app/ui/os_app.js && node --check backend/app/ui/os_customizer.js
      - name: Test
        # Real-browser tests skip without Chromium; the rest needs no network.
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/tests -q -p no:cacheprovider --timeout=120 -rs
